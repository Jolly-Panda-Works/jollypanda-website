server {
    listen 80;
    server_name localhost;
    root /html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # This is a multi-page static site (index/about/services/projects/...),
    # not an SPA, so unmatched URLs return a real 404 - not a silent 200
    # redirect to index.html (a "soft 404", which search engines penalize).
    # Persian pages live under /fa/, so they get the Persian 404 page;
    # everything else gets the English one.
    location /fa/ {
        try_files $uri $uri/ =404;
        error_page 404 /fa/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    # Block access to hidden files and sensitive directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /node_modules {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(md|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
