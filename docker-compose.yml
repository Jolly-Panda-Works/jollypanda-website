version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: jolly-panda-homepage-web
    restart: unless-stopped
    ports:
      - "4084:80"
    volumes:
      - ./:/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
